<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard · Panel de Usuarios</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">

  <!-- Barra superior -->
  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-brand-600 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.4-1.8M17 20H7m10 0v-2c0-.7-.1-1.3-.4-1.8M7 20H2v-2a3 3 0 015.4-1.8M7 20v-2c0-.7.1-1.3.4-1.8m0 0a5 5 0 019.2 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
        </div>
        <div>
          <h1 class="text-base font-bold leading-tight">Dashboard</h1>
          <p class="text-xs text-slate-500 leading-tight">Usuarios registrados</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <div class="text-right hidden sm:block">
          <p class="text-sm font-semibold" id="current-user">—</p>
          <p class="text-xs text-slate-500">Sesión activa</p>
        </div>
        <button id="logout-btn"
          class="px-3 py-2 text-sm font-semibold rounded-lg border border-slate-700 text-slate-300
                 hover:bg-red-600 hover:border-red-600 hover:text-white transition-colors flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          Cerrar Sesión
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-8">

    <!-- Mensaje de retroalimentación -->
    <div id="alert" class="hidden mb-6 px-4 py-3 rounded-lg text-sm border"></div>

    <!-- Tarjetas de resumen -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-5">
        <p class="text-xs uppercase tracking-wider text-slate-500 mb-1">Total de usuarios</p>
        <p class="text-3xl font-bold" id="stat-total">—</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-5">
        <p class="text-xs uppercase tracking-wider text-slate-500 mb-1">Tu usuario</p>
        <p class="text-3xl font-bold truncate" id="stat-user">—</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-5">
        <p class="text-xs uppercase tracking-wider text-slate-500 mb-1">Último registro</p>
        <p class="text-3xl font-bold truncate" id="stat-last">—</p>
      </div>
    </div>

    <!-- Tabla -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-800 flex items-center justify-between">
        <h2 class="font-semibold">Listado de usuarios</h2>
        <button id="refresh-btn"
          class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 hover:bg-slate-700 transition-colors">
          Actualizar
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-slate-800/50 text-slate-400">
            <tr>
              <th class="text-left font-semibold px-5 py-3">ID</th>
              <th class="text-left font-semibold px-5 py-3">Usuario</th>
              <th class="text-left font-semibold px-5 py-3">Fecha de registro</th>
            </tr>
          </thead>
          <tbody id="users-tbody" class="divide-y divide-slate-800">
            <tr>
              <td colspan="3" class="px-5 py-10 text-center text-slate-500">Cargando usuarios...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <p class="text-center text-xs text-slate-600 mt-8">
      Endpoint protegido <code class="text-slate-500">GET /api/users</code> · autenticado con JWT
    </p>
  </main>

  <script src="app.js"></script>
</body>
</html>
