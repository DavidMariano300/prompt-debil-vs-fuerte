<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso · Panel de Usuarios</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4">

  <div class="w-full max-w-md">

    <!-- Encabezado -->
    <div class="text-center mb-8">
      <div class="mx-auto mb-4 w-14 h-14 rounded-2xl bg-brand-600 flex items-center justify-center shadow-lg shadow-brand-600/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold tracking-tight" id="page-title">Iniciar Sesión</h1>
      <p class="text-sm text-slate-400 mt-1" id="page-subtitle">Accede con tu cuenta para ver el panel</p>
    </div>

    <!-- Tarjeta -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 sm:p-8">

      <!-- Selector Login / Registro -->
      <div class="grid grid-cols-2 gap-1 p-1 bg-slate-800/70 rounded-xl mb-6">
        <button id="tab-login" type="button"
          class="py-2 text-sm font-semibold rounded-lg transition-colors bg-brand-600 text-white">
          Iniciar Sesión
        </button>
        <button id="tab-register" type="button"
          class="py-2 text-sm font-semibold rounded-lg transition-colors text-slate-400 hover:text-slate-200">
          Registrarse
        </button>
      </div>

      <!-- Mensaje de retroalimentación -->
      <div id="alert" class="hidden mb-5 px-4 py-3 rounded-lg text-sm border"></div>

      <!-- Formulario -->
      <form id="auth-form" class="space-y-4" novalidate>
        <div>
          <label for="username" class="block text-sm font-medium text-slate-300 mb-1.5">Usuario</label>
          <input id="username" name="username" type="text" autocomplete="username" required
            placeholder="tu_usuario"
            class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-lg text-slate-100 placeholder-slate-600
                   focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition" />
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-slate-300 mb-1.5">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required
            placeholder="••••••••"
            class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-lg text-slate-100 placeholder-slate-600
                   focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition" />
          <p id="password-hint" class="hidden text-xs text-slate-500 mt-1.5">Mínimo 6 caracteres.</p>
        </div>

        <button id="submit-btn" type="submit"
          class="w-full py-2.5 bg-brand-600 hover:bg-brand-700 disabled:opacity-60 disabled:cursor-not-allowed
                 text-white font-semibold rounded-lg transition-colors flex items-center justify-center gap-2">
          <span id="submit-text">Entrar</span>
          <svg id="submit-spinner" class="hidden animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.4 0 0 5.4 0 12h4z"></path>
          </svg>
        </button>
      </form>

      <p class="text-center text-xs text-slate-500 mt-6" id="switch-hint">
        ¿No tienes cuenta?
        <button type="button" id="switch-link" class="text-brand-500 hover:text-brand-400 font-medium">Crea una aquí</button>
      </p>
    </div>

    <p class="text-center text-xs text-slate-600 mt-6">
      Express · JWT · SQLite · Tailwind CSS
    </p>
  </div>

  <script src="app.js"></script>
</body>
</html>
