<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Iniciar sesión</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="center-screen">
  <div class="card">
    <h1>Bienvenido</h1>
    <div class="tabs">
      <div class="tab active" data-tab="login">Iniciar sesión</div>
      <div class="tab" data-tab="register">Registrarse</div>
    </div>

    <form id="login-form" class="form active">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" required autocomplete="username" />
      <label for="login-password">Contraseña</label>
      <input type="password" id="login-password" required autocomplete="current-password" />
      <div class="error-msg" id="login-error"></div>
      <button type="submit">Entrar</button>
    </form>

    <form id="register-form" class="form">
      <label for="register-name">Nombre</label>
      <input type="text" id="register-name" required />
      <label for="register-email">Email</label>
      <input type="email" id="register-email" required autocomplete="username" />
      <label for="register-password">Contraseña</label>
      <input type="password" id="register-password" required minlength="6" autocomplete="new-password" />
      <div class="error-msg" id="register-error"></div>
      <div class="success-msg" id="register-success"></div>
      <button type="submit">Crear cuenta</button>
    </form>
  </div>
</div>
<script src="js/login.js"></script>
</body>
</html>
